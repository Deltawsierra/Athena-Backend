name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # mythos-core is a private sibling repo, so pip's git clone of it needs a
      # credential the default GITHUB_TOKEN does not carry across repositories.
      # Provide a MYTHOS_CORE_TOKEN secret -- a fine-grained PAT (or deploy key)
      # with read access to Deltawsierra/Mythos-Core -- and this rewrites the
      # clone URL to use it. Until that secret exists the step fails here with a
      # clear message: that is the one remaining setup task, not a code defect.
      # (Alternatives if you'd rather not manage a token: publish mythos-core to
      # an index and pin a version instead of a git URL, or vendor it as a
      # submodule -- both are follow-ups, this keeps the dependency a git pin.)
      - name: Authenticate the private mythos-core dependency
        env:
          MYTHOS_CORE_TOKEN: ${{ secrets.MYTHOS_CORE_TOKEN }}
        run: |
          if [ -n "$MYTHOS_CORE_TOKEN" ]; then
            git config --global url."https://x-access-token:${MYTHOS_CORE_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::error::MYTHOS_CORE_TOKEN secret is not set; the private mythos-core git dependency cannot be cloned. Add it under Settings -> Secrets and variables -> Actions (a fine-grained PAT with read access to Deltawsierra/Mythos-Core)."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # A narrow, named gate rather than the whole of ruff. This repo carries
      # several hundred other findings that have not been worked through, and a
      # gate that fails on all of them would be switched off within a week; a
      # gate that fails on none of them protects nothing. These three rules were
      # swept to zero in the commit that added this step, so what this enforces
      # is that they stay there. Widen the list when another family reaches zero,
      # never by turning the gate off.
      #
      # ruff is pinned in requirements-dev.txt and the target Python version in
      # ruff.toml: between them, this check means the same thing here as it does
      # on a contributor's machine.
      - name: Lint (typing modernization)
        run: ruff check --select UP006,UP045,UP035 .

      # The second named gate, on the same principle. Every rule here describes
      # an exception that goes nowhere: caught and passed over, caught and
      # re-raised unchanged, a bare `pass` standing in for a body someone meant
      # to write. That is how a control ends up reporting nothing and looking
      # like it reported "fine" -- the report renderer fell back to the plainer
      # document on every scan in any environment without weasyprint, and said
      # so only when DEBUG was on, which is when nobody is watching.
      #
      # This repo is at zero on all five as of that fix, so the gate holds a line
      # that is already held rather than declaring a wish.
      #
      # Deliberately NOT here: BLE001 (blind-except), which still has 12
      # findings nobody has worked through. A gate that fails on the day it
      # lands is a gate that gets deleted the day after.
      - name: Lint (silently swallowed exceptions)
        run: ruff check --select S110,S112,TRY203,B012,PIE790 .

      # BLE001 joins the gate now that every `except Exception` in this repo is
      # either narrowed to the exceptions that can actually occur, or carries a
      # written reason for staying broad. That second form is the point: a blind
      # catch is sometimes right -- the audit trail must not crash the request it
      # records, a failed email must not fail the scan -- and the difference
      # between "right" and "nobody looked" is whether anyone wrote down which.
      #
      # RUF013 joins it because an implicit Optional annotation says a parameter
      # is required while the default says otherwise, so the documented way to
      # call the function is the unchecked path.
      #
      # NOT here: RUF100. Six `noqa` directives in this repo name rules the gate
      # does not enable (E402, F401, F403, F405, SLF001), and RUF100 reports each
      # as unused. They are not residue -- they are suppressions waiting for a
      # gate, with reasons attached. Enforcing RUF100 would demand deleting them,
      # which would throw away deliberate annotations to satisfy a checker. It
      # becomes enforceable when every rule they name is enabled, and not before.
      - name: Lint (exception handling and optional parameters)
        run: ruff check --select BLE001,RUF013 .

      # Syntax errors and undefined/unused names. The cheapest family there is,
      # and the one whose absence is least defensible: an F821 is a crash the
      # gate would have caught, and an F401 is a reader being told a module
      # depends on something it does not. minotaur-website has gated these since
      # it got CI at all; this repo had six dead imports and one name read from a
      # star import, which is the state a rule nobody runs produces.
      - name: Lint (undefined and unused names)
        run: ruff check --select E9,F .

      - name: Django checks
        run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
          DJANGO_DEBUG: "1"

      - name: Migrations are consistent with the models
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
          DJANGO_DEBUG: "1"

      # The settings module had no production form at all: DEBUG was hardcoded
      # on, the secret key had a published fallback, and every cookie and
      # transport setting was absent. This fails the build if that returns.
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SECRET_KEY: a-sufficiently-long-ci-secret-key-for-the-deploy-check-000
          DJANGO_ALLOWED_HOSTS: example.com

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
