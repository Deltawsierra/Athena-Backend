name: secret-scan

# A new secret in a change fails the build. The files a pull request or push touches
# are scanned with detect-secrets against .secrets.baseline, which records the
# findings already in the tree (by hash, never by value) when the gate was added;
# anything not in it fails. The scanner and its dependencies are pinned by hash in
# .github/secret-scan-requirements.txt. Exit 3 from the hook means only that a known
# finding moved to another line, so it passes; exit 1 is a new secret.
#
# The hex-entropy detector is off (see .secrets.baseline's plugins_used): recorded
# fixtures are full of SHA digests, which it reads as secrets. A hex token assigned
# to a secret-named variable is still caught by the keyword detector.
#
# A false positive in a change: mark the line `# pragma: allowlist secret` (or the
# language's comment equivalent), or regenerate the baseline with
# `detect-secrets scan --baseline .secrets.baseline` and review what it added.
#
# History is not scanned here: a secret already in git history has to be rotated,
# and purged from history where the repository is public.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets, pinned by hash
        run: python -m pip install --require-hashes --no-deps -r .github/secret-scan-requirements.txt
      - name: Scan what this change touches against the baseline
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff -z --name-only --diff-filter=ACMR "$base" HEAD > changed
          else
            git ls-files -z > changed   # first push, or a base this clone cannot see
          fi
          if [ ! -s changed ]; then echo "no files changed"; exit 0; fi
          # Called directly, not through xargs: xargs reports any failing exit as
          # 123, which would turn "a known finding moved line" (3) into a failure.
          mapfile -d '' files < changed
          set +e
          detect-secrets-hook --baseline .secrets.baseline "${files[@]}"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "only known findings moved line; no new secret"
            exit 0
          fi
          exit "$status"
