# Upstream advisories Athena-Backend tracks, as a standing regression source.
#
# One entry per published advisory against a dependency on the path from an
# engine's answer to this service's record -- the HTTP client every engine call,
# connector and posture read goes through, the telemetry and agent frameworks a
# collector is built on -- with the versions it affects, the
# versions that fix it, whether the dependency is installed here at all, and the
# test of this service's own that pins the advisory's behaviour against this
# service's use of it.
#
# tests/test_every_registered_advisory_is_fixed_here.py reads this file in CI,
# with no network: it fails when a registered dependency is installed at an
# affected version, when a requirement this repository declares admits one, when
# a dependency recorded as absent turns up installed (its use then has to be
# reviewed against the advisory and recorded here), and when a named test no
# longer exists.
#
# `installed` records what the dependency trees showed when the entry was
# written (the trees are in the pull request that added it). It says nothing
# about any deployment: an advisory listed here is not a claim that this
# service, or anything built on it, was ever affected.
#
# To add an entry: the advisory's own id, affected ranges and fixed versions,
# copied from the advisory; and a test that fails if this engine's use of the
# dependency behaves the way the advisory describes.

[[advisory]]
id = "GHSA-4x9p-g9wm-8q7f"
dependency = ["pydantic-ai", "pydantic-ai-slim"]
summary = "OpenTelemetry instrumentation: include_content=False does not redact exceptions, error statuses, instructions or the output template"
affected = [">=0.3.4,<1.107.6", ">=2.0.0b1,<2.44.0"]
fixed = ["1.107.6", "2.44.0"]
installed = false
use = "Not a dependency. The same channel on this service's own spans: an exception, chained, leaving the span a claim derivation runs under."
tests = [
  "tests/test_an_exception_reaches_a_span_as_its_type_alone.py::test_a_derivation_that_fails_leaves_its_span_as_one_type",
]

