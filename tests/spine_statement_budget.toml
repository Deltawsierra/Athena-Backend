# SPINE's statement budget (Phase 5.5): how many SQL statements each SPINE path issues,
# exactly, over the seeded corpus (tests/spine_corpus.py), per finding profile of it.
# tests/test_spine_statement_budget.py holds every line, with no margin:
#
# - a path that issues MORE fails until its line is raised, and a raised line says why on
#   the same line, so the diff shows the rise and its reason together:
#       recompute_decision.all-accepted = { statements = 31, approved = "one line: why" }
#   A rise with no reason, a blank one, or the reason the line already carried is refused
#   (against the budget the change started from: SPINE_BUDGET_BASE, else where HEAD left
#   origin/master);
# - a path that issues FEWER fails until its line is lowered, so the budget keeps no
#   headroom a later rise could spend unseen.
#
# The test's failure names each line that moved, both counts, and the line to write.
# One line per path and profile, so pull requests that move different lines merge
# cleanly. The README's "SPINE's statement budget" has the rest.

